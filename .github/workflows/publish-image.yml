name: Publish Scout Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (also pushes :latest)"
        required: true
        default: "latest"
        type: string

env:
  IMAGE_NAME: ghcr.io/macrocontent/scout

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'latest' }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/macrocontent/scout
            org.opencontainers.image.description=Macro ScoutAPI self-hosted
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Before: $(gh api /orgs/macrocontent/packages/container/scout --jq .visibility)"
          # Prefer raw JSON body
          if echo '{"visibility":"public"}' | gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /orgs/macrocontent/packages/container/scout \
            --input -; then
            echo "PATCH json OK"
          elif gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /orgs/macrocontent/packages/container/scout \
            -f visibility=public; then
            echo "PATCH form OK"
          else
            echo "PATCH failed — dumping package metadata"
            gh api /orgs/macrocontent/packages/container/scout
            exit 1
          fi
          echo "After: $(gh api /orgs/macrocontent/packages/container/scout --jq .visibility)"

      - name: Verify anonymous pull
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/macrocontent/scout/manifests/latest" || true)
          echo "Anonymous manifest HTTP $code"
          test "$code" != "401" && test "$code" != "403"
