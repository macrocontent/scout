name: Publish Scout Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (also pushes :latest)"
        required: true
        default: "latest"
        type: string
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "src/**"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/publish-image.yml"

env:
  IMAGE_NAME: ghcr.io/macrocontent/scout

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'latest' }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/macrocontent/scout
            org.opencontainers.image.description=Macro ScoutAPI self-hosted
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/orgs/macrocontent/packages/container/scout" \
              -f visibility=public; then
              echo "Package visibility set to public"
              gh api "/orgs/macrocontent/packages/container/scout" --jq '{name,visibility,repository:.repository.full_name}'
              exit 0
            fi
            echo "attempt $attempt failed; retry"
            sleep 5
          done
          exit 1

      - name: Verify anonymous pull
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/macrocontent/scout/manifests/latest" || true)
          echo "Anonymous manifest HTTP $code"
          test "$code" != "401" && test "$code" != "403"
